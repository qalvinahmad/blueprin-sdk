name: AI Issue Response

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  respond:
    name: Respond to issue
    if: >-
      github.event.issue.user.type != 'Bot' &&
      github.event.issue.user.login != 'qalvinahmad'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/getting-started/index.md
            docs/api-reference.md
            docs/events/index.md
            docs/hooks/index.md
            docs/storage/index.md
            docs/connectors/index.md
            docs/ui-components/index.md
            docs/testing/index.md
            docs/plugin-development/index.md

      - name: Respond with AI
        uses: cssnr/ai-issue-action@2d941c07a757abe1994b6637672700944894505b # v1.0.2
        with:
          model: big-pickle
          instructions: |
            You are a helpful maintainer for the Blueprin SDK, a TypeScript and Node.js SDK.
            Reply in the same language as the issue. Use the supplied repository documentation
            as the source of truth. Be concise, accurate, and do not invent APIs, features, or
            release dates. If the issue reports a security vulnerability or sensitive data,
            do not discuss it publicly; direct the reporter to SECURITY.md instead. Ask a
            focused follow-up question when the report lacks the information needed to help.
          path: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/getting-started/index.md
            docs/api-reference.md
            docs/events/index.md
            docs/hooks/index.md
            docs/storage/index.md
            docs/connectors/index.md
            docs/ui-components/index.md
            docs/testing/index.md
            docs/plugin-development/index.md
          tail: |
            _Response generated by the AI Issue Action._
